[package]
name = "treasury-program"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "treasury_program"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
# Slice 22: `init_if_needed` for the holder forfeiture record
# (created on first enroll or first default, consumed/queued
# thereafter). Re-initialization protection, stated: the account
# is PDA seeds-bound to ["forfeiture", holder], so only a
# program-signed CPI can create a program-owned account at that
# address; init_if_needed re-initializes nothing with a matching
# discriminator, and neither handler zeroes a live field — enroll
# only decrements pending_slots, settle_default only increments
# it — so a second entry can never wipe a queued forfeiture.
anchor-lang = { version = "=1.2.1", features = ["init-if-needed"] }

# Funding path (deposit, 2026-10-26): NO anchor-spl dependency, by
# finding, not by taste. anchor-spl 1.2.1's token_2022 /
# token_interface modules pull spl-token-2022-interface, which
# depends unconditionally on solana-zk-sdk, which depends on
# getrandom — and getrandom does not support the SBF target, so
# `anchor build` fails (reproduced 2026-10-26, both with default
# features and with the minimal token_2022 feature set; the
# token_2022_extensions feature is not the only poison path).
# The deposit CPI is therefore hand-rolled against the stable SPL
# Token instruction layouts (TransferChecked = 12, amount LE +
# decimals; InitializeAccount = 1; account orders per the
# interface builders), verified against
# spl-token-2022-interface 2.1.0's instruction builders in the
# registry source. This follows the program's own precedent:
# hand-rolled SignalRecord creation (step-2 fork) exists because
# Anchor's machinery failed there too. Revisit anchor-spl only
# if the zk-sdk/getrandom chain becomes SBF-safe.

# Placement C (design §1.2): the pristine kernel crate, compiled into the
# program (no_std SBF). `default-features = false` selects the crate's
# no_std + alloc build; the program uses only the no_std-compatible API
# (Amount::from_raw, never the std-only from_f64/to_f64 conveniences).
# Path from this crate: programs/treasury-program -> Kernel/kernel.
coordination-kernel = { path = "../../../kernel", default-features = false }

# Same transitive pins as the W3.3 mock build (SBF cargo 1.79 /
# edition2024 incompatibility, proven 2026-10-23).
cpufeatures = "=0.2.17"
sha2 = "=0.10.8"
blake3 = "=1.5.4"
proc-macro-crate = "=3.4.0"
zeroize = "=1.8.1"
indexmap = "=2.9.0"
unicode-segmentation = "=1.12.0"
