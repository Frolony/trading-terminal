[package]
name = "program-v04"
version = "0.1.0"
edition = "2021"
description = "Migration step 5, slices 5-19: the v0.4 program scaffold (slice 5) plus the §4.1 genesis instruction initialize_kernel and the first §3 account KernelState (slice 6) plus the seal_kernel instruction with the no_std port of the launch genesis steps (slice 7) plus the TransitionRecord account and register_transition instruction gated on the sealed head (slice 8) plus the ObservationRecord account, ingest_observation instruction, and the identity pubkey-to-agent mapping with sealed-profile proposer/observer gates (slice 9) plus the first replay instruction replay_transition, which runs kernel ingest_observation + register_transition from a stored record pair and advances the stage to KERNEL_REGISTERED (slice 10) plus the clock instruction advance_clock, which moves KernelState.clock forward-only under sealed-state and ClockRegression gates (slice 11) plus the second replay instruction evaluate_transition, which runs kernel evaluate_transition on a KERNEL_REGISTERED record under the program env answering C1 = Pass and O1 = true and advances the stage to EVALUATED (slice 12) plus the third replay instruction mark_eligible, which runs kernel mark_eligible on an EVALUATED record under the program env after replaying ingest + register + evaluate and advances the stage to ELIGIBLE (slice 13) plus the persistence of the proven eligibility window (eligible_at / consensus_deadline) on the record, written on success only (slice 14) plus the SignalRecord account and submit_signal instruction, which replays ingest + register + evaluate + mark_eligible at the stored eligible_at and then the supplied prior signals before submitting the new signal through the real kernel and returning its tally (slice 15) plus the select_candidate instruction, which advances an ELIGIBLE record to SELECTED only on a kernel-proven selection after the consensus window closes, with the supplied prior set required to number exactly the record's signal_count completeness anchor, written by submit_signal on success only (slice 16) plus the select_candidate_with_siblings instruction, which replays supplied sibling transitions into one rebuilt kernel as a merged timeline so the kernel's SiblingsStillOpen and OutrankedBySibling arms can fire, with per-sibling signal_count completeness and a fail-closed equal-eligibility tie rule (slice 17). plus the already-selected sibling replay, which re-proves a SELECTED sibling's own select at the state's clock before the target's select so the kernel's ParentAlreadyHasASelectedTransition arm can fire, admitting at most one SELECTED sibling (slice 18) plus the sibling-set completeness anchor, a per-parent eligible census on KernelState written by mark_eligible on success only, gated by both select helpers before any replay so an omitted eligible competitor refuses and the plain select is the sole-eligible path only (slice 19). The delivered v0.4.1 kernel crate compiled into an Anchor program under the pinned toolchain (Anchor 1.2.1 / Solana 4.1.2 / platform-tools v1.54). The kernel object itself is not persisted — KernelState records the seal outcome; the further transition-replay families and CU golden set are later step-5 slices, not this one. Consumes the delivered v0.4 crate by path; modifies neither it nor Kernel/ in the repo."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "program_v04"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "=1.2.1", features = ["init-if-needed"] }

# Placement C (design §1.2, v0.4 line): the delivered kernel crate,
# compiled into the program (no_std SBF). `default-features = false`
# selects the crate's no_std + alloc build; the program uses only the
# no_std-compatible API (Amount::from_raw / consts, never the std-only
# from_f64 convenience). Path from this crate:
# programs/program-v04 -> v04-intake/coordination-kernel-rs.
coordination-kernel = { path = "../../../coordination-kernel-rs", default-features = false }

# Same transitive pins as the v0.2 treasury program.
cpufeatures = "=0.2.17"
sha2 = "=0.10.8"
blake3 = "=1.5.4"
proc-macro-crate = "=3.4.0"
zeroize = "=1.8.1"
indexmap = "=2.9.0"
unicode-segmentation = "=1.12.0"
