[package]
name = "program-v04"
version = "0.1.0"
edition = "2021"
description = "Migration step 5, slices 5-7: the v0.4 program scaffold (slice 5) plus the §4.1 genesis instruction initialize_kernel and the first §3 account KernelState (slice 6) plus the seal_kernel instruction with the no_std port of the launch genesis steps (slice 7). The delivered v0.4.1 kernel crate compiled into an Anchor program under the pinned toolchain (Anchor 1.2.1 / Solana 4.1.2 / platform-tools v1.54). The kernel object itself is not persisted — KernelState records the seal outcome; the transition-replay families and CU golden set are later step-5 slices, not this one. Consumes the delivered v0.4 crate by path; modifies neither it nor Kernel/ in the repo."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "program_v04"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "=1.2.1", features = ["init-if-needed"] }

# Placement C (design §1.2, v0.4 line): the delivered kernel crate,
# compiled into the program (no_std SBF). `default-features = false`
# selects the crate's no_std + alloc build; the program uses only the
# no_std-compatible API (Amount::from_raw / consts, never the std-only
# from_f64 convenience). Path from this crate:
# programs/program-v04 -> v04-intake/coordination-kernel-rs.
coordination-kernel = { path = "../../../coordination-kernel-rs", default-features = false }

# Same transitive pins as the v0.2 treasury program.
cpufeatures = "=0.2.17"
sha2 = "=0.10.8"
blake3 = "=1.5.4"
proc-macro-crate = "=3.4.0"
zeroize = "=1.8.1"
indexmap = "=2.9.0"
unicode-segmentation = "=1.12.0"
