[package]
name = "cu-golden-mollusk-v04"
version = "0.1.0"
edition = "2021"
description = "V0.4 program CU golden-test harness (mollusk-svm path): executes program-v04 instructions in-process and records measured compute units per instruction. No validator, no devnet, no mainnet."

# Standalone crate: the parent program-v04/ Cargo.toml is a workspace
# (members = programs/*) and this crate is NOT a member, so it must be
# its own workspace root or cargo refuses to build it.
[workspace]

[dependencies]
# Exact pin: the golden file records this version, so a later 0.16.x
# resolution must not silently change the measurement environment.
# (Cargo.lock is committed alongside, pinning the whole tree.)
mollusk-svm = "=0.16.4"
solana-account = "4.3"
solana-instruction = "3.2"
solana-pubkey = "4.1"
sha2 = "0.10"
serde_json = "1.0"
