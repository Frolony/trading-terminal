# N6.2 — E2E regression suite: alert-only CI trigger. (PROPER FIX VARIANT v5 — prepared 2026-10-23 ~22:57 CST, supersedes v4 posted as commit 1faeb77d)
#
# v5 change (the only functional delta from v4): the "Run E2E suite" step now receives
# VERCEL_AUTOMATION_BYPASS_SECRET from the GitHub Actions repo secrets. Carlos decided
# 2026-10-23 ~22:57 CST to relax bot protection for CI after issue #8 proved the GitHub
# Actions runner was being served Vercel's Security Checkpoint interstitial (403s, app
# never loaded) instead of the app — T5.1/T5.2's failures were a CI-reachability problem,
# not product bugs. tests/e2e/playwright.config.js reads this env var and, only when it
# is present, sends the x-vercel-protection-bypass + x-vercel-set-bypass-cookie headers
# on every request. The secret VALUE lives only in Vercel (project Settings → Deployment
# Protection → Protection Bypass for Automation) and in the GitHub repo's Actions secrets
# — it is never committed, never in this file, and the repo is public.
#
# v4 change (the only functional delta from v3): the deployment-wait poll now
# distinguishes an UNAUTHORIZED token from a deployment that is genuinely not
# READY yet. Runs #4 (commit 5f6ec13) and #5 (commit 636753a) both burned the
# full 35-minute wait reporting NOT_FOUND while their production deployments
# were verifiably READY with matching githubCommitSha in meta (checked
# independently via the Vercel connector) — the poll's jq maps ANY api failure
# (including HTTP 401/403 from a bad VERCEL_TOKEN) to NOT_FOUND, so a dead
# token looks exactly like a slow deployment. v4 captures the HTTP status: a
# 401/403 fails fast via fail_with_report with a token-specific message
# (regenerate the token, update the repo secret) instead of burning 35 min,
# and every poll logs http code + listed-deployment count for diagnosis.
#
# v3 change (the only functional delta from v2): RESULTS_JSON in the report job corrected
# from e2e-artifacts/tests/e2e/playwright-results.json to e2e-artifacts/playwright-results.json.
# upload-artifact v4 stores matched files relative to their least common ancestor — every
# uploaded path lives under tests/e2e/, so the results file lands at the artifact root.
# Run #3 (commit eff4fc2b, v2) proved it: the seed uploaded fine, but the reporter looked
# at the old nested path, found nothing, exited 1, and filed NO alert issue (repo issues: 0).
# Verified locally 2026-10-23: reporter + stubbed gh files the alert with the v3 path and
# reproduces the silent exit-1 with the v2 path.
#
# v2 change (the only functional delta from v1): the e2e job seeds a fallback Playwright
# results file immediately after checkout, before anything can fail. Run #1 (2026-10-23,
# commit 9f9cb218) proved why: it died at actions/setup-node in 9s — the setup-node cache
# path tests/e2e/package-lock.json did not exist because the tests/e2e suite files had
# never been pushed (only the reporter script had) — so no results file existed, the
# upload step created no artifact, and the report job crashed on download-artifact:
# a CI failure that produced NO alert issue. With the seed, any failure before the suite
# produces real results still uploads an artifact and the reporter files the alert with
# a pipeline-failure entry. When the suite runs, its JSON reporter overwrites the seed.
# (The missing suite files themselves are pushed separately as a normal code push.)
#
# Gating policy (§8.6, decided 2026-10-23 by Carlos): ALERT-ONLY — "just alert me, keep shipping."
# A failed run must surface as a material report (which tests failed, on which deployment/commit)
# and file/reopen the GitHub issue per the failed-acceptance rule. It must NEVER block pushes,
# deployments, or production promotion — this workflow declares no required-status checks and
# sets no deployment gates.
#
# Trigger history: the original file triggered on `deployment_status`, on the assumption that
# Vercel's GitHub integration posts deployment events. Verified 2026-10-23 ~13:47–13:57 CST:
# it does not — the repo has no GitHub Deployments at all and the workflow recorded zero runs
# after multiple production deployments. This variant therefore triggers on `push` to main and
# has the workflow itself confirm, via the Vercel API, that the production deployment for the
# pushed commit is READY before the suite runs — so the suite tests the deployment it claims
# to test. Requires one repo secret: VERCEL_TOKEN (a Vercel API token; added by Carlos in
# GitHub repo Settings → Secrets and variables → Actions — never via chat).
#
# Other triggers (unchanged):
#   - schedule: nightly against production — the feed-drift sentinel. If DexScreener's schema
#     drifts, the fixture-intercepted T4 tests fail loudly here (alert-only) before anyone
#     depends on a false green.
#   - workflow_dispatch: manual run against production (debugging / re-run after a fix).
#
# Suite coverage: T1.1–T1.3 (N1.1 reset), T2.1–T2.3 (N1.2 MAX), T3.1–T3.3 (N1.3 watchlist),
# T4.1–T4.4 (N1.4 24h change), T5.1–T5.2 (N1.5 sub-cent), T6.1–T6.4 (N1.6 feed resilience +
# N2.1 persistence). Chromium is the canonical CI browser (the VM-local Firefox config exists
# only because the VM's egress proxy refuses Chromium CONNECT tunnels; GitHub runners have no
# such proxy).

name: E2E regression (N6.2)

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *' # 05:17 UTC nightly (~23:17 CST) — production feed-drift sentinel
  workflow_dispatch:

permissions:
  contents: read
  issues: write # alert-only reporting: file/reopen the e2e-regression issue on failure

concurrency:
  group: e2e-${{ github.sha }}
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright E2E (production)
    runs-on: ubuntu-latest
    timeout-minutes: 55 # up to ~35 min waiting for the deployment + ~15 min suite/install
    env:
      BASE_URL: https://gecko-solana-terminal.vercel.app
      # Commit under test: the pushed commit (push), the branch head otherwise.
      UNDER_TEST_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # v2: seed a fallback results file BEFORE anything can fail. If a later step
      # (setup, install, deployment wait) dies, the upload step still has a file, an
      # artifact is created, and the report job files the alert instead of crashing
      # on a missing artifact (run #1's silent failure). The suite's JSON reporter
      # overwrites this file when the suite actually runs.
      - name: Seed fallback results (alert-path insurance)
        run: |
          mkdir -p tests/e2e
          jq -n '{suites:[{title:"ci-pipeline",file:"ci-pipeline",specs:[{title:"CI pipeline reaches the E2E suite and the suite produces results",outcome:"unexpected",tests:[{results:[{status:"failed",error:{message:"The workflow run ended before the E2E suite produced results — a setup, install, or deployment-wait step failed. See the failed step in the workflow run log."}}]}]}],suites:[]}]}' > tests/e2e/playwright-results.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install E2E deps
        run: npm ci
        working-directory: tests/e2e

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Wait for this commit's production deployment
        if: github.event_name == 'push'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          UNDER_TEST_SHA: ${{ github.sha }}
        run: |
          set -u
          api="https://api.vercel.com/v6/deployments?projectId=prj_hxnJsT45fdz2BmPjaOZBR2078yt4&teamId=team_fHW8WwtE1ZrfVfH5m7ZVTYxp&target=production&limit=10"
          # On a deployment-side failure, synthesize a minimal Playwright-shaped results file
          # so the existing report job files the alert issue through the same path as a test
          # failure (the reporter requires RESULTS_JSON to exist).
          fail_with_report() {
            msg="$1"
            echo "::error::$msg"
            mkdir -p tests/e2e
            jq -n --arg msg "$msg" '{suites:[{title:"deployment",file:"deployment",specs:[{title:"Production deployment for the pushed commit reaches READY",outcome:"unexpected",tests:[{results:[{status:"failed",error:{message:$msg}}]}]}],suites:[]}]}' > tests/e2e/playwright-results.json
            exit 1
          }
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            fail_with_report "VERCEL_TOKEN repo secret is not set, so the workflow cannot confirm the production deployment for $UNDER_TEST_SHA. Add the secret (repo Settings, Secrets and variables, Actions) or switch the trigger strategy."
          fi
          deadline=$(( $(date +%s) + 2100 )) # 35 min — slowest observed Vercel build ~25 min
          while :; do
            http_code=$(curl -s -o /tmp/vercel-deps.json -w "%{http_code}" -H "Authorization: Bearer $VERCEL_TOKEN" "$api") || http_code="000"
            resp=$(cat /tmp/vercel-deps.json 2>/dev/null || echo "")
            if [ "$http_code" = "401" ] || [ "$http_code" = "403" ]; then
              fail_with_report "Vercel API rejected VERCEL_TOKEN (HTTP $http_code) when listing deployments for team team_fHW8WwtE1ZrfVfH5m7ZVTYxp. The token is expired, revoked, or lacks access to the team scope — regenerate it in the Vercel dashboard and update the VERCEL_TOKEN repo secret (GitHub repo Settings → Secrets and variables → Actions). The E2E suite did not run."
            fi
            dep_count=$(printf '%s' "$resp" | jq -r '.deployments | length // 0' 2>/dev/null || echo "?")
            state=$(printf '%s' "$resp" | jq -r --arg sha "$UNDER_TEST_SHA" '[.deployments[]? | select(.meta.githubCommitSha == $sha)][0] | (.readyState // .state // "NOT_FOUND")' 2>/dev/null || echo "QUERY_FAILED")
            url=$(printf '%s' "$resp" | jq -r --arg sha "$UNDER_TEST_SHA" '[.deployments[]? | select(.meta.githubCommitSha == $sha)][0] | (.url // "")' 2>/dev/null || echo "")
            echo "deployment state for $UNDER_TEST_SHA: $state ${url} (vercel api http=$http_code, deployments listed=$dep_count)"
            case "$state" in
              READY)
                echo "Production is serving $UNDER_TEST_SHA — settling 30s for edge propagation."
                sleep 30
                break
                ;;
              ERROR|CANCELED)
                fail_with_report "Vercel production deployment for commit $UNDER_TEST_SHA ended in state $state (${url}). The E2E suite did not run; production may still be serving the previous build. See the workflow run log and the Vercel dashboard."
                ;;
            esac
            if [ "$(date +%s)" -ge "$deadline" ]; then
              fail_with_report "Timed out after 35 min waiting for the Vercel production deployment of commit $UNDER_TEST_SHA to reach READY (last seen state: $state). The E2E suite did not run."
            fi
            sleep 30
          done

      - name: Run E2E suite
        run: npx playwright test --project=chromium --reporter=line,json,html
        working-directory: tests/e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
          # v5: Protection Bypass for Automation — playwright.config.js turns this into
          # the x-vercel-protection-bypass headers (see the v5 header note).
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ github.run_id }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            tests/e2e/playwright-results.json
          retention-days: 14

  report:
    name: File/reopen the alert issue
    needs: [e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The alert script files/queries issues by label; ensure it exists so the
      # first-ever failure files cleanly instead of tripping on a missing label.
      - name: Ensure e2e-regression label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create e2e-regression --description "Alert-only E2E regression failures (N6.2, gating policy §8.6)" --color B60205 2>/dev/null || true

      - name: Download results
        if: needs.e2e.result == 'failure'
        uses: actions/download-artifact@v4
        with:
          name: e2e-report-${{ github.run_id }}
          path: e2e-artifacts

      - name: File or update the e2e-regression issue (failure)
        if: needs.e2e.result == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTS_JSON: e2e-artifacts/playwright-results.json
          UNDER_TEST_SHA: ${{ github.sha }}
          BASE_URL: https://gecko-solana-terminal.vercel.app
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tests/e2e/scripts/ci-issue-report.cjs

      - name: Close the alert issue on green (recovery)
        if: needs.e2e.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNDER_TEST_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node tests/e2e/scripts/ci-issue-report.cjs --close-on-green
